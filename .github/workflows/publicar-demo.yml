name: publicar-demo

# El código fuente del juego vive ordenado en ant-farm-rpg/, pero el artefacto de Pages publica SU
# CONTENIDO en la raíz. Así la dirección visible es https://untopo.github.io/antfarm-idle/ y no una
# ruta interna. La ruta antigua conserva un redirect mínimo para no romper enlaces ya compartidos.
#
# Se dispara solo en cada push a master y a mano desde Actions > publicar-demo > Run workflow.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: montar el sitio en la raíz pública
        run: bash scripts/build-pages-root.sh _sitio

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - name: desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
