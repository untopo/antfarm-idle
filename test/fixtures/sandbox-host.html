<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Host sandbox - prueba de dialogos bloqueados</title>
  <style>body{margin:0;background:#111;display:flex;justify-content:center}</style>
</head>
<body>
  <!--
    Fixture de prueba (no forma parte del juego): embebe el index.html en un iframe con
    sandbox="allow-scripts allow-same-origin" y DELIBERADAMENTE sin allow-modals. Es el entorno
    de los previews embebidos y de varios navegos moviles, donde alert()/confirm()/prompt() se
    ignoran y devuelven false. Si ahi se puede crear una granja, se puede crear en cualquier lado.
  -->
  <iframe src="/ant-farm-rpg/index.html" sandbox="allow-scripts allow-same-origin"
          style="width:1280px;height:760px;border:0" title="ANT FARM en iframe sandbox"></iframe>
</body>
</html>
